# Local Postgres for DATA_BACKEND=postgres (does not replace OCI ORDS).
# Optional DynamoDB Local for hybrid experiments:
#   docker compose --profile hybrid up -d
#   DYNAMODB_ENDPOINT=http://127.0.0.1:8000 DYNAMODB_TABLE=...
services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud-store-893-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: cloudstore
      POSTGRES_PASSWORD: cloudstore
      POSTGRES_DB: cloudstore
    volumes:
      - cloud_store_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudstore -d cloudstore"]
      interval: 5s
      timeout: 5s
      retries: 10

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    container_name: cloud-store-893-dynamodb
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    profiles:
      - hybrid

volumes:
  cloud_store_pg_data:
